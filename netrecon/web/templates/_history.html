{% for item in result %}
    <div class="history-item" hx-get="/scan?target={{ item.target }}&mode={{ item.scan_type }}"
         hx-target="#results" hx-trigger="click">
        <div class="target">{{ item.target }}</div>
        <div class="meta">{{ item.scan_type }} &middot; {{ item.started_at[:19] }}</div>
    </div>
{% else %}
    <p class="placeholder">No scans yet.</p>
{% endfor %}
